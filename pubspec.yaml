name: fleettrack
description: "FleetTrack - Transport Attendance & Salary Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Supabase
  supabase_flutter: ^2.9.0

  # Formatting
  intl: ^0.20.2

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.2

  # CSV
  csv: ^6.0.0

  # File Picker
  file_picker: ^8.1.7

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Share files
  share_plus: ^10.1.4

  # Path provider
  path_provider: ^2.1.5

  # UUID
  uuid: ^4.5.1

  # Google Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
